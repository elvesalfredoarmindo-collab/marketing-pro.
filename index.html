<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketingPro - Elves Alfredo Armindo</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
        }
        header {
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }
        .hero {
            padding: 4rem 1rem;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .hero p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        .form-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem;
            text-align: left;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .form-card input, .form-card textarea {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
        }
        .form-card textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-card button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .form-card button:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo">Docente Elves Alfredo Armindo</a>
        </div>
    </header>

    <section class="hero">
        <h1>Domine o Marketing Moderno</h1>
        <p>Inscreva-se abaixo para garantir sua vaga e receber todas as novidades diretamente no seu e-mail.</p>
        
        <div class="form-card">
            <h3 style="margin-bottom: 1.5rem; text-align: center;">Faça sua Inscrição</h3>
            
            <form action="https://api.web3forms.com/submit" method="POST">
              <input type="hidden" name="access_key" value="648f48b9-c0f6-4e20-a83b-91e4e6b6ec42">
              
              <label style="display:block; margin-bottom:0.5rem; font-size:0.9rem; color:var(--text-muted);">Seu Nome</label>
              <input type="text" name="name" placeholder="Digite seu nome completo" required>
              
              <label style="display:block; margin-bottom:0.5rem; font-size:0.9rem; color:var(--text-muted);">Seu E-mail</label>
              <input type="email" name="email" placeholder="seu@email.com" required>
              
              <label style="display:block; margin-bottom:0.5rem; font-size:0.9rem; color:var(--text-muted);">Mensagem ou Dúvida</label>
              <textarea name="message" placeholder="Escreva sua mensagem..." required></textarea>
              
              <button type="submit">Enviar Inscrição</button>
            </form>
        </div>
    </section>

</body>
</html>
